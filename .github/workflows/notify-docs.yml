name: Notify docs repository

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          PAYLOAD: |
            {
              "event_type": "docs-updated",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "before": "${{ github.event.before }}",
                "after": "${{ github.sha }}"
              }
            }
        run: echo "$PAYLOAD" | gh api repos/chitalian/multirepo-test-docs/dispatches --input -
